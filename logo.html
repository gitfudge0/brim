<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>brim — logo options</title>
<style>
  :root { --bg:#0d1117; --fg:#e6edf3; --mut:#7d8590; --card:#161b22; --line:#30363d; --accent:#3fb950; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; padding:32px; }
  h1 { font-size:22px; margin:0 0 4px; }
  p.sub { color:var(--mut); margin:0 0 28px; }
  .controls { margin-bottom:24px; display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
  .controls label { color:var(--mut); cursor:pointer; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:18px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:22px; display:flex; flex-direction:column; align-items:center; gap:16px; }
  .art { width:120px; height:120px; display:flex; align-items:center; justify-content:center; }
  .meta { text-align:center; }
  .meta .n { font-weight:600; }
  .meta .d { color:var(--mut); font-size:12px; }
  .wordmark { font-size:24px; font-weight:700; letter-spacing:-0.5px; display:flex; align-items:center; gap:8px; }
  .light .card { background:#fff; border-color:#d0d7de; }
  .light .meta .d { color:#57606a; }
</style>
</head>
<body>
<h1>brim</h1>
<p class="sub">Logo options — track AI quotas from the terminal. Pick one, I'll refine + export SVG.</p>

<div class="controls">
  <label><input type="checkbox" id="bg"> Light background</label>
  <label>Accent <input type="color" id="ac" value="#3fb950"></label>
</div>

<div class="grid" id="grid"></div>

<script>
const A = () => getComputedStyle(document.documentElement).getPropertyValue('--accent');
// each logo: function returning SVG markup. ac = accent color.
const logos = [
 {n:"01 · Gauge cup", d:"Cup filled to the brim = usage gauge", svg:ac=>`
  <svg width="96" height="96" viewBox="0 0 96 96" fill="none">
   <rect x="24" y="20" width="48" height="56" rx="8" stroke="${ac}" stroke-width="5"/>
   <rect x="24" y="44" width="48" height="32" rx="8" fill="${ac}"/>
   <line x1="36" y1="20" x2="36" y2="76" stroke="#0d1117" stroke-width="2" opacity=".25"/>
   <line x1="48" y1="20" x2="48" y2="76" stroke="#0d1117" stroke-width="2" opacity=".25"/>
   <line x1="60" y1="20" x2="60" y2="76" stroke="#0d1117" stroke-width="2" opacity=".25"/>
  </svg>`},

 {n:"02 · Overflow drop", d:"Brimming over — a drop at the lip", svg:ac=>`
  <svg width="96" height="96" viewBox="0 0 96 96" fill="none">
   <path d="M28 30 h40 v30 a20 20 0 0 1 -40 0 z" fill="${ac}"/>
   <ellipse cx="48" cy="30" rx="20" ry="6" fill="${ac}" opacity=".5"/>
   <path d="M70 34 q6 8 0 14 q-6 -6 0 -14z" fill="${ac}"/>
  </svg>`},

 {n:"03 · Bracket B", d:"Monospace [b] — terminal native", svg:ac=>`
  <svg width="96" height="96" viewBox="0 0 96 96" fill="none">
   <text x="48" y="64" font-family="ui-monospace,monospace" font-size="48" font-weight="700" fill="${ac}" text-anchor="middle">[b]</text>
  </svg>`},

 {n:"04 · Quota ring", d:"Radial fill — quota remaining", svg:ac=>`
  <svg width="96" height="96" viewBox="0 0 96 96" fill="none">
   <circle cx="48" cy="48" r="30" stroke="#30363d" stroke-width="9"/>
   <circle cx="48" cy="48" r="30" stroke="${ac}" stroke-width="9" stroke-linecap="round"
     stroke-dasharray="188" stroke-dashoffset="62" transform="rotate(-90 48 48)"/>
   <text x="48" y="55" font-family="ui-monospace,monospace" font-size="22" font-weight="700" fill="${ac}" text-anchor="middle">b</text>
  </svg>`},

 {n:"05 · Hat brim", d:"Literal brim — a flat cap silhouette", svg:ac=>`
  <svg width="96" height="96" viewBox="0 0 96 96" fill="none">
   <path d="M30 50 a18 18 0 0 1 36 0 z" fill="${ac}"/>
   <rect x="18" y="50" width="60" height="8" rx="4" fill="${ac}"/>
  </svg>`},

 {n:"06 · Stacked bars", d:"Three providers, three bars", svg:ac=>`
  <svg width="96" height="96" viewBox="0 0 96 96" fill="none">
   <rect x="22" y="56" width="14" height="24" rx="3" fill="${ac}" opacity=".5"/>
   <rect x="41" y="40" width="14" height="40" rx="3" fill="${ac}" opacity=".75"/>
   <rect x="60" y="24" width="14" height="56" rx="3" fill="${ac}"/>
  </svg>`},

 {n:"07 · Fill line B", d:"B with a rising fill level", svg:ac=>`
  <svg width="96" height="96" viewBox="0 0 96 96">
   <defs><clipPath id="b7"><path d="M34 22 h18 a14 14 0 0 1 0 28 h-18 z M34 50 h22 a14 14 0 0 1 0 28 h-22 z"/></clipPath></defs>
   <g clip-path="url(#b7)">
     <rect x="20" y="20" width="60" height="60" fill="#30363d"/>
     <rect x="20" y="52" width="60" height="28" fill="${ac}"/>
   </g>
  </svg>`},

 {n:"08 · Terminal prompt", d:"Caret + cursor block", svg:ac=>`
  <svg width="96" height="96" viewBox="0 0 96 96" fill="none">
   <rect x="16" y="20" width="64" height="56" rx="10" stroke="${ac}" stroke-width="5"/>
   <path d="M30 42 l10 8 l-10 8" stroke="${ac}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
   <rect x="50" y="54" width="16" height="6" rx="3" fill="${ac}"/>
  </svg>`},

 {n:"09 · Meniscus", d:"Liquid surface curve at the brim", svg:ac=>`
  <svg width="96" height="96" viewBox="0 0 96 96" fill="none">
   <circle cx="48" cy="48" r="30" stroke="${ac}" stroke-width="5"/>
   <path d="M20 48 q14 -10 28 0 t28 0 v22 a30 30 0 0 1 -56 0 z" fill="${ac}"/>
  </svg>`},

 {n:"10 · Pixel B", d:"Blocky bitmap b — retro CLI", svg:ac=>`
  <svg width="96" height="96" viewBox="0 0 96 96" fill="${ac}" shape-rendering="crispEdges">
   <rect x="28" y="20" width="10" height="56"/>
   <rect x="38" y="40" width="20" height="10"/>
   <rect x="38" y="66" width="20" height="10"/>
   <rect x="58" y="50" width="10" height="16"/>
  </svg>`},

 {n:"11 · Spark gauge", d:"Half-dial speedometer", svg:ac=>`
  <svg width="96" height="96" viewBox="0 0 96 96" fill="none">
   <path d="M22 64 a26 26 0 0 1 52 0" stroke="#30363d" stroke-width="8" stroke-linecap="round"/>
   <path d="M22 64 a26 26 0 0 1 40 -22" stroke="${ac}" stroke-width="8" stroke-linecap="round"/>
   <line x1="48" y1="64" x2="62" y2="46" stroke="${ac}" stroke-width="5" stroke-linecap="round"/>
   <circle cx="48" cy="64" r="5" fill="${ac}"/>
  </svg>`},

 {n:"12 · Droplet stack", d:"Token = a drop in the bucket", svg:ac=>`
  <svg width="96" height="96" viewBox="0 0 96 96" fill="none">
   <path d="M48 18 C60 38 66 46 66 56 a18 18 0 0 1 -36 0 C30 46 36 38 48 18z" fill="${ac}"/>
   <path d="M48 40 C54 50 57 53 57 58 a9 9 0 0 1 -18 0 C39 53 42 50 48 40z" fill="#0d1117" opacity=".25"/>
  </svg>`},
];

const grid = document.getElementById('grid');
function render(){
  const ac = document.getElementById('ac').value;
  grid.innerHTML = logos.map(l=>`
    <div class="card">
      <div class="art">${l.svg(ac)}</div>
      <div class="wordmark"><span style="color:${ac}">▸</span>brim</div>
      <div class="meta"><div class="n">${l.n}</div><div class="d">${l.d}</div></div>
    </div>`).join('');
}
document.getElementById('ac').addEventListener('input',render);
document.getElementById('bg').addEventListener('change',e=>document.body.classList.toggle('light',e.target.checked));
render();
</script>
</body>
</html>
